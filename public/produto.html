<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Allaska — Produto</title>
  <meta name="description" content="Soluções de IA para empresas B2B: sites, prospecção automática, conteúdo, remarketing e atendimento inteligente. Implementamos em dias, não meses.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Allaska">
  <meta property="og:title" content="Allaska — Produto">
  <meta property="og:description" content="Soluções de IA para empresas B2B: sites, prospecção automática, conteúdo, remarketing e atendimento inteligente.">
  <link rel="canonical" href="https://allaska.com.br/produto.html">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--c:#7c5cff}
    html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
    body{background:#080808;color:#f0f0eb;font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}

    /* ── NAV ── */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:20px 48px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(8,8,8,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .nav-logo{font-size:17px;font-weight:700;letter-spacing:.1em;color:#fff;text-transform:uppercase;text-decoration:none}
    .nav-back{font-size:12px;font-weight:600;color:rgba(255,255,255,.82);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:8px 20px;text-decoration:none;cursor:pointer;transition:background .18s,color .18s}
    .nav-back:hover{background:rgba(255,255,255,.15);color:#fff}

    /* ── HERO SPLIT ── */
    .lp-hero{position:relative;min-height:90vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
    .lp-hero-bg{position:absolute;inset:0;z-index:0}
    .lp-hero-left{position:relative;z-index:2;padding:130px 64px 80px 64px;display:flex;flex-direction:column;justify-content:center}
    .lp-hero-right{position:relative;z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:500px}
    .lp-hero-sep{position:absolute;left:50%;top:10%;bottom:10%;width:1px;background:rgba(255,255,255,.06);z-index:3}

    .product-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:100px;padding:4px 14px;margin-bottom:28px;opacity:.9;align-self:flex-start}
    .lp-headline{font-size:clamp(26px,3.8vw,50px);font-weight:800;line-height:1.07;letter-spacing:-.04em;color:#fff;margin-bottom:20px}
    .lp-headline em{color:#fff;font-style:normal}
    .lp-subtitle{font-size:15px;color:rgba(255,255,255,.42);line-height:1.72;max-width:480px;margin-bottom:36px}
    .lp-hero-ctas{display:flex;flex-wrap:wrap;gap:12px}

    /* ── DIVIDER ── */
    .lp-divider{width:100%;height:1px;background:rgba(255,255,255,.06)}

    /* ── SECTIONS ── */
    .lp-section{padding:64px 48px;max-width:1100px;margin:0 auto}
    .section-label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c);margin-bottom:16px;display:block}

    /* ── PROBLEMA ── */
    .problema-text p{font-size:15px;color:rgba(255,255,255,.46);line-height:1.85;max-width:680px;margin-bottom:16px}
    .problema-text p:last-child{margin-bottom:0}

    /* ── STEPS ── */
    .steps{display:flex;flex-direction:column}
    .step{display:grid;grid-template-columns:48px 1fr;gap:0 20px;padding:24px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .step:last-child{border-bottom:none}
    .step-num{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.28);flex-shrink:0;margin-top:2px}
    .step-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .step-title{font-size:15px;font-weight:600;color:rgba(255,255,255,.88);letter-spacing:-.02em}
    .step-time{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:100px;padding:2px 8px;opacity:.8}
    .step-desc{font-size:13.5px;color:rgba(255,255,255,.38);line-height:1.8}

    /* ── INCLUSO + RESULTADO ── */
    .details-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px}
    @media(max-width:768px){.details-grid{grid-template-columns:1fr}}
    .incluso-list{list-style:none;display:flex;flex-direction:column;gap:10px}
    .incluso-list li{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:rgba(255,255,255,.62);line-height:1.6}
    .incluso-list li::before{content:'✓';color:var(--c);font-weight:700;flex-shrink:0;margin-top:1px}
    .resultado-text{font-size:14px;color:rgba(255,255,255,.42);line-height:1.82;margin-bottom:32px}
    .investimento-block{padding:22px 24px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.025)}
    .inv-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:14px;display:block}

    /* Pricing dual (vitalício / mensal) */
    .pricing-dual{display:grid;grid-template-columns:1fr 1px 1fr;align-items:start}
    .pricing-vsep{background:rgba(255,255,255,.08);margin:0 20px;align-self:stretch;min-height:72px}
    .po-tag{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);margin-bottom:8px;display:block}
    .po-price{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.04em;line-height:1;margin-bottom:7px}
    .po-price small{font-size:13px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:0}
    .po-note{font-size:11px;color:rgba(255,255,255,.28);line-height:1.55}

    /* Pricing tiers (produto 01) */
    .pricing-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .pt{position:relative;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.02);cursor:default;transition:border-color .2s,background .2s}
    .pt:hover{border-color:var(--c);background:rgba(255,255,255,.04)}
    .pt-name{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px;display:block}
    .pt-price{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.2}

    /* Tooltip hover */
    .pt-tooltip{
      position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);
      width:220px;background:#1a1a1a;border:1px solid rgba(255,255,255,.12);border-radius:10px;
      padding:14px 16px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.7);
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
      z-index:10;white-space:normal;
    }
    .pt-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
      border:6px solid transparent;border-top-color:#1a1a1a}
    .pt:hover .pt-tooltip{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── BOTÕES ── */
    .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;background:#fff;color:#0a0a0a;font-size:13px;font-weight:700;letter-spacing:.03em;text-decoration:none;border-radius:100px;transition:opacity .2s,transform .2s}
    .btn-primary:hover{opacity:.88;transform:translateY(-1px)}
    .btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;background:transparent;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;letter-spacing:.03em;text-decoration:none;border:1px solid rgba(255,255,255,.14);border-radius:100px;transition:border-color .2s,color .2s}
    .btn-secondary:hover{border-color:rgba(255,255,255,.32);color:rgba(255,255,255,.9)}

    /* ── CTA SECTION ── */
    .lp-cta-section{padding:64px 48px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
    .cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
    .cta-note{font-size:11px;color:rgba(255,255,255,.22)}

    /* ── COMBO BLOCK ── */
    .combo-block{margin:0 48px 80px;padding:36px 44px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.025);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
    .combo-block h3{font-size:19px;font-weight:700;color:#fff;letter-spacing:-.03em;margin-bottom:6px}
    .combo-block p{font-size:13px;color:rgba(255,255,255,.38);line-height:1.6;max-width:460px}
    .btn-combo{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.78);font-size:12.5px;font-weight:600;letter-spacing:.03em;text-decoration:none;border:1px solid rgba(255,255,255,.14);border-radius:100px;transition:background .2s,color .2s;white-space:nowrap}
    .btn-combo:hover{background:rgba(255,255,255,.13);color:#fff}

    /* ── FOOTER ── */
    .lp-footer{padding:28px 48px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .footer-brand{font-size:14px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.3);text-transform:uppercase}
    .footer-note{font-size:11px;color:rgba(255,255,255,.18)}

    /* ════════════════════════════════════════════════
       ANIMAÇÕES DOS VISUAIS 3D
    ════════════════════════════════════════════════ */
    @keyframes spv-float   {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes spv-float2  {0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes spv-float3d {0%,100%{transform:perspective(700px) rotateX(8deg) rotateY(-11deg) translateY(0)}50%{transform:perspective(700px) rotateX(6deg) rotateY(-14deg) translateY(-10px)}}
    @keyframes spv-slide-r {from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
    @keyframes spv-slide-u {from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spv-bubble  {from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spv-line-in {from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
    @keyframes spv-node-p  {0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.5);opacity:1}}
    @keyframes spv-star-f  {to{opacity:1;filter:none}}
    @keyframes spv-progress{from{width:0}to{width:var(--pw,80%)}}
    @keyframes spv-pulse-r {0%{transform:translate(-50%,-50%) scale(1);opacity:.75}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
    @keyframes spv-sweep   {from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes spv-orbit   {from{transform:translate(-50%,-50%) rotate(0deg) translateX(52px)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(52px)}}

    /* visual wrapper */
    .slv-wrap{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
    /* browser */
    .slv-browser{width:82%;max-width:320px;border:1px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.025)}
    .slv-brow{display:flex;align-items:center;gap:8px;padding:8px 12px}
    .slv-bdots{display:flex;gap:5px}
    .slv-bdots span{width:8px;height:8px;border-radius:50%;display:block}
    .slv-burl{flex:1;height:18px;border-radius:100px;display:flex;align-items:center;padding:0 10px;font-size:7.5px;color:rgba(255,255,255,.25);letter-spacing:.04em}
    .slv-bcontent{padding:12px 16px;display:flex;flex-direction:column;gap:7px}
    /* posts */
    .slv-posts{display:flex;flex-direction:column;gap:10px;width:78%;max-width:270px}
    .slv-post{border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);opacity:0;animation:spv-bubble .4s ease var(--pd,0s) forwards}
    .slv-post-img{height:70px}
    .slv-post-body{padding:8px 12px;display:flex;flex-direction:column;gap:5px}
    /* chat */
    .slv-chat{width:88%;max-width:290px;display:flex;flex-direction:column;gap:8px}
    .slv-msg{padding:8px 12px;border-radius:14px;font-size:11px;color:rgba(255,255,255,.62);line-height:1.5;opacity:0;animation:spv-bubble .4s ease var(--md,0s) forwards;max-width:88%}
    .slv-msg.inp{align-self:flex-start;border-bottom-left-radius:3px}
    .slv-msg.out{align-self:flex-end;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-bottom-right-radius:3px}
    /* radar */
    .slv-radar{position:relative;width:210px;height:210px}
    .slv-rring{position:absolute;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
    .slv-rsweep{position:absolute;top:50%;left:50%;height:1px;transform-origin:left center;animation:spv-sweep 2.5s linear infinite}
    .slv-rdot{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%)}
    /* doc */
    .slv-doc{width:78%;max-width:250px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:rgba(255,255,255,.03);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
    .slv-check{display:flex;align-items:center;gap:8px;opacity:0;animation:spv-bubble .3s ease var(--cd,0s) forwards}
    .slv-check-box{width:14px;height:14px;border-radius:3px;flex-shrink:0;border:1.5px solid;display:flex;align-items:center;justify-content:center}
    .slv-check-lbl{font-size:10px;color:rgba(255,255,255,.45)}
    /* stars */
    .slv-stars-big{display:flex;flex-direction:column;align-items:center;gap:12px}
    .slv-stars-row{display:flex;gap:10px}
    .slv-star-big{font-size:30px;opacity:0;animation:spv-star-f .5s ease var(--std,0s) forwards}
    .slv-rating{font-size:52px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .slv-reviews{font-size:11px;color:rgba(255,255,255,.28);letter-spacing:.06em}

    /* ── RESPONSIVE ── */
    @media(max-width:900px){
      .lp-hero{grid-template-columns:1fr;min-height:auto}
      .lp-hero-left{padding:120px 32px 48px}
      .lp-hero-right{min-height:360px;border-top:1px solid rgba(255,255,255,.06)}
      .lp-hero-sep{display:none}
      nav{padding:18px 24px}
      .lp-section{padding:48px 24px}
      .lp-cta-section{padding:48px 24px}
      .combo-block{margin:0 24px 60px;padding:28px 24px}
      .lp-footer{padding:24px}
    }
  </style>
  <script>
    function navBack() {
      if (window.opener && !window.opener.closed) {
        window.close();
        setTimeout(() => { window.location.href = 'index.html'; }, 300);
      } else if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</head>
<body>

<nav>
  <a class="nav-back" href="javascript:void(0)" onclick="navBack()">← Voltar</a>
  <a class="nav-logo" href="index.html">Allaska</a>
</nav>

<div id="lp-root"></div>

<script>
const WA = 'https://wa.me/5511940643165?text=';
const COMBO_MSG = encodeURIComponent('Olá, ALLASKA! Quero montar um combo personalizado para o meu negócio. Pode me ajudar?');

/* ── Helpers glass ─────────────────────────────────── */
const G  = (c,x='') => `background:rgba(10,10,10,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid ${c}30;${x}`;
const G2 = (x='')   => `background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);${x}`;

/* ── Backgrounds temáticos ─────────────────────────── */
const BG = [
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 80% 40%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 80% 50%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 75% 40%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 78% 55%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 80% 45%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 80% 50%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 78% 40%'},
  {bg:'linear-gradient(135deg,#0a0a0a 0%,#080808 55%,#060606 100%)',glow:'at 76% 55%'},
];

/* ── Visuais 3D por produto ────────────────────────── */
const VIS = [
  // 01 Sites — Browser 3D flutuando
  c=>`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative">
    <div style="animation:spv-float3d 5s ease-in-out infinite;position:relative;flex-shrink:0">
      <div style="width:300px;${G(c,'border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px '+c+'28;overflow:hidden')}">
        <div style="padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.03)">
          <span style="width:8px;height:8px;border-radius:50%;background:#e74c3c60;display:block"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#f39c1260;display:block"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#3ecf5e60;display:block"></span>
          <div style="flex:1;background:rgba(255,255,255,.06);border-radius:100px;padding:3px 10px;font-size:7.5px;color:rgba(255,255,255,.28);margin-left:4px">seusite.com.br</div>
        </div>
        <div style="height:62px;background:linear-gradient(135deg,${c}22,${c}06);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;padding:0 16px;animation:spv-line-in .5s .2s both">
          <div style="font-size:14px;font-weight:700;color:rgba(255,255,255,.68)">Seu Negócio · Premium</div>
        </div>
        <div style="padding:12px 16px;display:flex;flex-direction:column;gap:7px">
          ${[65,82,48,72,56].map((w,i)=>`<div style="height:7px;width:${w}%;background:rgba(255,255,255,.07);border-radius:3px;transform-origin:left;animation:spv-line-in .4s ${.3+i*.1}s both"></div>`).join('')}
          <div style="display:flex;gap:8px;margin-top:4px">
            ${[['CTA Principal',true],['Saiba mais',false]].map(([l,p])=>`<div style="padding:6px 12px;background:${p?c+'30':'rgba(255,255,255,.04)'};border-radius:100px;border:1px solid ${p?c+'55':'rgba(255,255,255,.06)'};font-size:7.5px;color:${p?c:'rgba(255,255,255,.25)'};animation:spv-line-in .4s .75s both">${l}</div>`).join('')}
          </div>
        </div>
      </div>
      <div style="position:absolute;top:-32px;right:-62px;${G(c,'border-radius:12px;padding:12px 16px;white-space:nowrap')};animation:spv-slide-r .5s .9s both,spv-float2 4s ease-in-out 1.5s infinite">
        <div style="font-size:24px;font-weight:800;color:${c};letter-spacing:-.04em">+312%</div>
        <div style="font-size:8.5px;color:rgba(255,255,255,.35);margin-top:1px">visitantes orgânicos</div>
      </div>
      <div style="position:absolute;bottom:-32px;left:-56px;${G2('border-radius:12px;padding:12px 16px;white-space:nowrap')};animation:spv-slide-r .5s 1.1s both,spv-float 5s ease-in-out 2s infinite">
        <div style="font-size:24px;font-weight:800;color:#3ecf5e;letter-spacing:-.04em">#1</div>
        <div style="font-size:8.5px;color:rgba(255,255,255,.35);margin-top:1px">Google · barbearia SP</div>
      </div>
    </div>
  </div>`,

  // 02 Prospecção — mapa de leads
  c=>`<div style="width:100%;height:100%;position:relative;overflow:hidden">
    <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.35" viewBox="0 0 340 260" preserveAspectRatio="xMidYMid slice">
      ${Array.from({length:56},(_,i)=>{const x=18+(i%8)*40,y=18+Math.floor(i/8)*34,h=[3,8,11,18,22,27,31,36,42,49].includes(i);return `<circle cx="${x}" cy="${y}" r="${h?5:2.2}" fill="${h?c:'rgba(255,255,255,.18)'}"/>`}).join('')}

/* ── Render ──────────────────────────────────────────── */
function getParam(name){return new URLSearchParams(window.location.search).get(name)||'01';}

function renderLP(){
  const id  = getParam('id').padStart(2,'0');
  const p   = PRODUCTS[id] || PRODUCTS['01'];
  const idx = parseInt(id,10) - 1;
  const c   = p.color;
  const th  = BG[idx] || BG[0];

  document.title = `${p.name} — Allaska`;
  document.querySelector('meta[name="description"]').setAttribute('content', p.subtitle);
  document.querySelector('meta[property="og:title"]').setAttribute('content', `${p.name} — Allaska`);
  document.querySelector('meta[property="og:description"]').setAttribute('content', p.subtitle);
  document.querySelector('link[rel="canonical"]').setAttribute('href', `https://allaska.com.br/produto.html?id=${id}`);
  document.documentElement.style.setProperty('--c', c);

  const stepsHTML = p.steps.map((s,i)=>`
    <div class="step">
      <div class="step-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="step-head">
          <span class="step-title">${s.title}</span>
          ${s.time?`<span class="step-time">${s.time}</span>`:''}
        </div>
        <p class="step-desc">${s.desc}</p>
      </div>
    </div>`).join('');

  const inclusoHTML = p.incluso.map(i=>`<li>${i}</li>`).join('');
  const probHTML    = p.problema.split('\n\n').map(par=>`<p>${par}</p>`).join('');

  function renderPricing(pr) {
    if (!pr || pr.type === 'consult') return `<div class="po-price" style="font-size:16px;color:rgba(255,255,255,.5)">Sob consulta</div>`;
    if (pr.type === 'dual') return `
      <div class="pricing-dual">
        <div>
          <span class="po-tag">Vitalício</span>
          <div class="po-price">${pr.v}</div>
          <div class="po-note">Pagamento único — o sistema é seu para sempre. Sem manutenção inclusa; suporte sob demanda.</div>
        </div>
        <div class="pricing-vsep"></div>
        <div>
          <span class="po-tag">Mensal</span>
          <div class="po-price">${pr.m.replace('/mês','')}<small>/mês</small></div>
          <div class="po-note">Sistema seu para sempre — manutenção, atualizações e suporte inclusos todo mês.</div>
        </div>
      </div>`;
    if (pr.type === 'tiers') return `
      <div class="pricing-tiers">
        ${pr.tiers.map(t=>`
          <div class="pt">
            ${t.desc?`<div class="pt-tooltip">${t.desc}</div>`:''}
            <span class="pt-name">${t.n}</span>
            <div class="pt-price">${t.p}</div>
          </div>`).join('')}
      </div>`;
    return '';
  }
  const invHTML = renderPricing(p.pricing);

  const bgCSS    = th.bg;
  const glowCSS  = `radial-gradient(ellipse 65% 65% ${th.glow}, ${c}1c 0%, transparent 68%)`;

  document.getElementById('lp-root').innerHTML = `
    <!-- ── HERO ── -->
    <section class="lp-hero">
      <div class="lp-hero-bg" style="background:${bgCSS}">
        <div style="position:absolute;inset:0;background:${glowCSS};pointer-events:none"></div>
      </div>
      <div class="lp-hero-sep"></div>

      <div class="lp-hero-left">
        <span class="product-badge">${p.badge}</span>
        <h1 class="lp-headline">"${p.headline} <em>${p.hl2}</em>"</h1>
        <p class="lp-subtitle">${p.subtitle}</p>
        <div class="lp-hero-ctas">
          <a class="btn-primary" href="${WA}${encodeURIComponent(p.ctaMsg)}" target="_blank" rel="noopener">${p.ctaText}</a>
          <a class="btn-secondary" href="combo.html">Monte seu Combo →</a>
        </div>
      </div>

      <div class="lp-hero-right">
        ${VIS[idx] ? VIS[idx](c) : ''}
      </div>
    </section>
    <div class="lp-divider"></div>

    <!-- ── PROBLEMA ── -->
    <section class="lp-section">
      <span class="section-label">O Problema</span>
      <div class="problema-text">${probHTML}</div>
    </section>
    <div class="lp-divider"></div>

    <!-- ── COMO FUNCIONA ── -->
    <section class="lp-section">
      <span class="section-label">Como Funciona — Passo a Passo</span>
      <div class="steps">${stepsHTML}</div>
    </section>
    <div class="lp-divider"></div>

    <!-- ── INCLUSO + RESULTADO ── -->
    <section class="lp-section">
      <div class="details-grid">
        <div>
          <span class="section-label">O que está incluso</span>
          <ul class="incluso-list">${inclusoHTML}</ul>
        </div>
        <div>
          <span class="section-label">Resultado Esperado</span>
          <p class="resultado-text">${p.resultado}</p>
          <div class="investimento-block">
            <div class="inv-label">Investimento</div>
            ${invHTML}
          </div>
        </div>
      </div>
    </section>
    <div class="lp-divider"></div>

    <!-- ── CTA ── -->
    <section class="lp-cta-section">
      <div class="cta-row">
        <a class="btn-primary" href="${WA}${encodeURIComponent(p.ctaMsg)}" target="_blank" rel="noopener">${p.ctaText}</a>
        <a class="btn-secondary" href="combo.html">Monte seu Combo →</a>
      </div>
      <p class="cta-note">Ao clicar, você será direcionado ao WhatsApp da ALLASKA.</p>
    </section>

    <!-- ── COMBO BLOCK ── -->
    <div class="combo-block">
      <div>
        <h3>Não sabe por onde começar? Monte seu combo personalizado.</h3>
        <p>Responda 3 perguntas rápidas e a ALLASKA monta o pacote ideal para o seu negócio.</p>
      </div>
      <a class="btn-combo" href="combo.html">Montar meu Combo →</a>
    </div>

    <!-- ── FOOTER ── -->
    <footer class="lp-footer">
      <span class="footer-brand">Allaska</span>
      <span class="footer-note">© 2026 Allaska · Todos os direitos reservados</span>
    </footer>
  `;
}

renderLP();
</script>
